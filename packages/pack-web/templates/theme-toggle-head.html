<!-- Applies a stored light/dark choice before the first paint, so the page doesn't flash: after Josh W. Comeau, https://www.joshwcomeau.com/react/dark-mode/ -->
<script>
  try {
    const theme = localStorage.getItem('theme');
    if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
  } catch {}
</script>
