name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is covered by the release workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check package-lock.json is in sync
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code package-lock.json

      - name: Lint
        run: npm run lint

      # Ubuntu 23.10+ keeps Chromium's sandbox from starting (no AppArmor profile); web:check --render needs it
      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
