name: Release

# Builds a released tag and stages one package on npm via trusted publishing
# (OIDC). Dispatched automatically by release-please.yml, once per package,
# when a release is created; can also be run by hand to re-publish a tag.
# The staged version only goes live after a maintainer approves it on
# npmjs.com or with `npm stage approve`.
# The npm trusted publisher is bound to this file name, so keep it release.yml
# – each published package needs its own trusted publisher entry on npmjs.com
# pointing at this repo, this workflow file and the "publishing" environment.

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package directory to publish, e.g. packages/jen or packages/pack-cpp.'
        required: false
        type: string
        default: packages/jen
      tag:
        description: 'Git tag to publish, e.g. jen-v1.1.0. Defaults to the latest GitHub release.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Stage publish to npm
    runs-on: ubuntu-latest
    # Must match the environment configured on the npm trusted publisher
    environment: publishing
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing and provenance
    steps:
      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check package version matches tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PACKAGE: ${{ inputs.package }}
        run: |
          version="$(node -p "require('./${PACKAGE}/package.json').version")"
          expected="${TAG##*-v}"
          if [ "$version" != "$expected" ]; then
            echo "$PACKAGE/package.json version is $version but tag $TAG expects $expected" >&2
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Stage publish
        env:
          PACKAGE: ${{ inputs.package }}
        run: npm stage publish -w "$PACKAGE"
