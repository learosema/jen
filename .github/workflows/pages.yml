name: Pages

on:
  push:
    branches: [main]
    paths: [docs/**, packages/pack-glsl/**, packages/pack-web/**, packages/pack-js/**]
  workflow_dispatch:

permissions:
  contents: read

# Only one Pages deployment at a time; don't cancel a deployment already in flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The GLSL, web and js recipes' live previews (docs/glsl/, docs/web/, docs/js/, gitignored)
      # are made by the packs themselves. Type-only imports, so Node runs the
      # scripts without npm ci.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate GLSL previews
        run: node packages/pack-glsl/scripts/docs-assets.ts

      - name: Generate web previews
        run: node packages/pack-web/scripts/docs-assets.ts

      - name: Generate js previews
        run: node packages/pack-js/scripts/docs-assets.ts

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
