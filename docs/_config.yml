title: jen
description: A scaffolding CLI. Extremely lightweight. Blazing fast. Zero extra dependencies.

# GitHub Pages builds this folder with its stock Jekyll, so no plugins and no Gemfile.
markdown: kramdown
kramdown:
  smart_quotes: apos,apos,quot,quot   # keep straight quotes, like the hand-written HTML had
  auto_ids: false      # headings that need an anchor say so: ## Title {#anchor}

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - CLAUDE.md
  - README.md
