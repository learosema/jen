<section class="langs reveal" aria-label="Languages jen can scaffold">
  <p class="kicker">Scaffolds anything that's text</p>
  <ul class="cluster">
    {%- for lang in site.data.langs %}
    <li class="lang{% if lang.soon %} soon{% endif %}{% if lang.more %} more{% endif %}" style="--i:{{ forloop.index0 }}{% if lang.color %};--c:{{ lang.color }};--t:{{ lang.text }}{% endif %}"{% if lang.soon %} title="Pack coming soon"{% endif %}><b class="badge{% if lang.hex %} hex{% endif %}">{{ lang.badge }}</b><span>{{ lang.name }}{% if lang.soon %}<small>soon</small>{% endif %}</span></li>
    {%- endfor %}
  </ul>
</section>
