cli_help:
  - '$ jen cpp:enum --help'
  - 'cpp:enum – create an enum class with to_string() and a std::formatter specialization (header-only)'
  - '  --name (required)  the enum, any case: game-state and GameState both make GameState in GameState.h'
  - '  --values (required)  comma-separated enumerators, e.g. "idle, running, paused"'
  - '  --namespace=""  C++ namespace to wrap it in, nested ones as engine::physics; empty means the global namespace'
  - '  --std=23|20  C++ standard (20: std::abort instead of std::unreachable)'
  - '  --withTest  add a doctest case (needs cpp:doctest)'
  - ''
  - 'examples:'
  - '  jen cpp:enum --name=GameState --values="menu, playing, paused"'
  - '  jen cpp:enum --name=GameState --values="menu, playing, paused" --std=20 --withTest'
  - ''
  - 'docs: https://learosema.github.io/jen/recipes.html'

cli_plan:
  - "$ jen web:palette --primary=#5b5bd6 --dir=css"
  - "web:palette (pack @codejen/pack-web) – create a contrast-checked color palette (CSS custom properties)"
  - ""
  - "  + css/palette.css"
  - "  info: palette.css isn't imported anywhere yet: @import it yourself, or run jen web:base for a styles.css that does"
  - "  info: #5b5bd6 is closest to --color-primary-4 (--color-primary-large in light mode); buttons and links use the darker -5 in light mode, -4 with --contrast=aa"
  - ""
  - "✓ 1 written"
  - ""
  - "$ jen web:dialog --name=confirm --into=about.html --dir=css"
  - "web:dialog (pack @codejen/pack-web) – create a modal .dialog block (and with --into, a button that opens it via the command API, and the dialog)"
